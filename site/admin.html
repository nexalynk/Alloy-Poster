<!DOCTYPE html><html lang="en" data-base=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Admin | Alloy Poster</title><link rel="stylesheet" href="assets/style.css"></head>
<body><main><div class="wrap ph"><h1 style="font-size:32px">Admin</h1></div><section style="padding-top:8px"><div class="wrap" id="adm"></div></section></main>
<script src="assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/app.js"></script><script src="assets/api.js"></script><script>
const sb=API.sb,root=$("#adm"),ST=[...CONFIG.statuses,"Pending Payment","Cancelled"];
const TABS=[["dash","Dashboard"],["orders","Orders & production"],["pricing_rules","Pricing & shipping"],["product_sizes","Sizes"],["product_options","Finish & mounting"],["discount_rules","Discounts"],["products","Products"],["site_settings","Site settings & logo"]];
const T={product_sizes:["sort",[["width","n","Width (in)"],["height","n","Height (in)"],["active","b","Show on site"],["sort","n","Order"]]],
 product_options:["sort",[["type","t","Type: finish, mount, enhance or shape"],["name","t","Name"],["multiplier","n","Price multiplier (finish only)"],["addon","n","Extra cost $ (mount / enhance)"],["active","b","Show on site"],["sort","n","Order"]]],
 discount_rules:["min_qty",[["min_qty","n","Buy at least (qty)"],["rate","p","Discount %"],["active","b","Active"]]],
 products:["sort",[["name","t","Name"],["slug","t","URL name"],["category","t","Category"],["badge","t","Badge (e.g. New)"],["gradient","t","Colors (two hex codes)"],["image","i","Photo"],["description","t","Short description"],["active","b","Show on site"],["sort","n","Order"]]]};
const PR=[["price_per_sq_in","Price per square inch ($)","Base print price = width × height × this number.","n"],["min_price","Minimum print price ($)","The lowest base price, before finish and options.","n"],["tax_rate","Sales tax (%)","Estimated tax added at checkout.","p"],["free_shipping_over","Free shipping over ($)","Orders at or above this amount ship free.","n"],["shipping_flat","Standard shipping ($)","Charged on orders below the free-shipping amount.","n"],["shipping_express","Express shipping extra ($)","Added when the customer chooses express.","n"]];
async function dash(){const v=$("#view"),since=new Date(Date.now()-30*864e5).toISOString();
 const{data,error}=await sb.from("orders").select("status,total,created_at").neq("status","Pending Payment").neq("status","Cancelled").gte("created_at",since);
 if(error){v.textContent="Couldn't load the dashboard.";return}
 const day=new Date().toDateString(),wk=Date.now()-7*864e5,n=s=>data.filter(o=>o.status===s).length,sum=a=>a.reduce((x,o)=>x+ +o.total,0);
 const td=data.filter(o=>new Date(o.created_at).toDateString()===day),w7=data.filter(o=>new Date(o.created_at)>wk);
 const card=(t,val,st,h)=>`<button class="box" ${st?`data-go="${st}"`:""} style="text-align:left;cursor:pointer;color:inherit;font:inherit"><div style="font-size:30px;font-weight:800">${val}</div><b>${t}</b><br><small>${h}</small></button>`;
 v.innerHTML=`<div class="cols3">${card("Needs review",n("Order Received")+n("Payment Confirmed")+n("Image Review"),"Payment Confirmed","Paid orders: check artwork, then start production")+card("In production",n("Production")+n("Quality Check"),"Production","Being made or checked")+card("Ready to ship",n("Packed"),"Packed","Add tracking and mark Shipped")+card("Today",td.length+" orders","","$"+sum(td).toFixed(2))+card("Last 7 days",w7.length+" orders","","$"+sum(w7).toFixed(2))+card("Last 30 days",data.length+" orders","","$"+sum(data).toFixed(2))}</div><p><small>Amounts include tax and shipping. Click a card to see those orders.</small></p>`}
async function pricing(){const v=$("#view"),{data}=await sb.from("pricing_rules").select("*"),R=Object.fromEntries((data||[]).map(r=>[r.key,+r.value]));
 v.innerHTML=`<form id="pf" class="box" style="max-width:560px">${PR.map(([k,l,h,t])=>`<label class="f" for="p_${k}">${l}</label><input id="p_${k}" type="number" step="any" min="0" required value="${R[k]==null?"":t==="p"?Math.round(R[k]*10000)/100:R[k]}"><small>${h}</small>`).join("")}<button class="btn" style="margin-top:16px">Save pricing</button></form><p><small>Checkout uses these numbers immediately. Visitors' browsers pick up new prices on their next visit.</small></p>`;
 $("#pf").onsubmit=async e=>{e.preventDefault();const rows=PR.map(([k,,,t])=>({key:k,value:t==="p"?+$("#p_"+k).value/100:+$("#p_"+k).value}));const{error}=await sb.from("pricing_rules").upsert(rows);toast(error?"Save failed. Check the values.":"Pricing saved")}}
const shrink=(f,max,asData)=>new Promise((ok,no)=>{if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast("Use a PNG, JPG or WEBP image.");return no()}const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);asData?ok(c.toDataURL("image/jpeg",.82)):c.toBlob(ok,"image/jpeg",.85)};im.onerror=no;im.src=URL.createObjectURL(f)});
const SF=[["site_name","Store name","t"],["logo","Logo","logo"],["promo_text","Announcement bar text","t"],["hero_title","Home page headline","t"],["hero_text","Home page subheading","a"],["contact_email","Contact email","t"],["contact_phone","Phone","t"],["contact_address","Address","t"],["footer_text","Footer note","t"],["about_text","About page text","a"],["shipping_policy","Shipping policy page text","a"],["returns_policy","Returns policy page text","a"],["privacy_policy","Privacy policy page text","a"],["terms_text","Terms page text","a"]];
const SN=[["ship_flat","Standard shipping ($)"],["free_ship_over","Free shipping over ($)"],["express_ship","Express shipping extra ($)"],["tax_rate","Sales tax (%)"]];
const smallLogo=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/png"))};im.onerror=no;im.src=URL.createObjectURL(f)});
async function settings(){const v=$("#view"),cur={};
 if(API.ready){const{data}=await sb.from("site_settings").select("*");(data||[]).forEach(r=>cur[r.key]=r.value)}else Object.assign(cur,CONFIG.site);
 const fld=([k,l,t])=>t==="logo"?`<label class="f" for="lf">Logo (PNG, JPG or WEBP, under 2 MB)</label>${cur.logo?`<img src="${esc(cur.logo)}" alt="Current logo" style="max-height:48px;display:block;margin:6px 0;background:#ccc;padding:4px">`:""}<input type="file" id="lf" accept="image/png,image/jpeg,image/webp"><small>Without a logo, the store name is shown as text.</small><label style="font-size:14px;display:block;margin-top:6px"><input type="checkbox" id="rl"> Remove current logo</label>`:`<label class="f" for="s_${k}">${l}</label>${t==="a"?`<textarea id="s_${k}" rows="4">${esc(cur[k]||"")}</textarea>`:`<input id="s_${k}" type="text" value="${esc(cur[k]||"")}">`}`;
 const nums=API.ready?'<p><small>Prices, shipping and tax are under "Pricing &amp; shipping".</small></p>':'<h2 style="font-size:18px;margin-top:24px">Shipping &amp; tax</h2>'+SN.map(([k,l])=>`<label class="f" for="s_${k}">${l}</label><input id="s_${k}" type="number" step="any" min="0" value="${esc(cur[k]==null?"":cur[k])}">`).join("");
 v.innerHTML=`<form id="sf2" class="box" style="max-width:640px">${SF.map(fld).join("")}${nums}<button class="btn" style="margin-top:16px">Save settings</button></form><p><small>Page text: separate paragraphs with a blank line, and start a line with ## for a heading. Leave a box empty to keep the built-in text.</small></p>`;
 $("#sf2").onsubmit=async e=>{e.preventDefault();const out={};SF.forEach(([k,,t])=>{if(t!=="logo")out[k]=$("#s_"+k).value.trim()});if(!API.ready)SN.forEach(([k])=>out[k]=$("#s_"+k).value);
  let logo=$("#rl").checked?"":cur.logo||"";const f=$("#lf").files[0];
  if(f){if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2097152){toast("The logo must be a PNG, JPG or WEBP under 2 MB.");return}
   try{if(API.ready){const p="logo-"+Date.now()+"."+f.type.split("/")[1].replace("jpeg","jpg"),u=await sb.storage.from("site-assets").upload(p,f,{contentType:f.type});if(u.error)throw u.error;logo=sb.storage.from("site-assets").getPublicUrl(p).data.publicUrl}else logo=await smallLogo(f)}catch(err){toast("Logo upload failed.");return}}
  out.logo=logo;
  if(API.ready){const{error}=await sb.from("site_settings").upsert(Object.entries(out).map(([key,value])=>({key,value})));toast(error?"Save failed.":"Settings saved. Visitors see them on their next visit.")}
  else{LS.set("ag_site",out);toast("Saved. Open the site to see it.")}
  settings()}}
function demoAdmin(){let list=JSON.parse(JSON.stringify(CONFIG.allProducts));const K=["name","category","badge","description","gradient"];
 const grab=()=>{list=$$("#pt tr[data-i]").map(tr=>{const p={active:tr.querySelector("[data-a]").checked,image:tr.querySelector("[data-rmimg]:checked")?"":tr.dataset.img||""};tr.querySelectorAll("[data-k]").forEach(i=>p[i.dataset.k]=i.value);return p})};
 const paint=()=>{$("#view").innerHTML=`<div class="box"><b>Demo admin: your product list, saved in this browser only.</b><br><small>Untick Show to hide a product, or add a new one. Connect Supabase (see README) to manage orders and prices for all visitors.</small></div><div style="overflow-x:auto"><table class="at" id="pt" style="margin-top:16px"><tr><th align="left">Show</th><th align="left">Name</th><th align="left">Category</th><th align="left">Badge</th><th align="left">Description</th><th align="left">Colors (2 hex)</th><th align="left">Photo</th><th></th></tr>${list.map((p,i)=>`<tr data-i="${i}" data-img="${esc(p.image||"")}"><td><input type="checkbox" data-a ${p.active!==false?"checked":""}></td>${K.map(k=>`<td><input data-k="${k}" value="${esc(p[k]||"")}"></td>`).join("")}<td>${p.image?`<img src="${esc(p.image)}" alt="" style="height:40px;display:block;margin-bottom:4px"><label style="font-size:13px"><input type="checkbox" data-rmimg> Remove</label>`:""}<input type="file" data-up accept="image/jpeg,image/png,image/webp"></td><td><button class="cartbtn" data-del="${i}">Delete</button></td></tr>`).join("")}</table></div><div class="cta"><button class="btn ghost" id="addp">Add product</button><button class="btn" id="savep">Save changes</button><button class="btn ghost" id="resetp">Reset to defaults</button></div>`;
  $$("[data-up]").forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;const tr=i.closest("tr");try{const d=await shrink(f,600,true);grab();list[+tr.dataset.i].image=d;paint()}catch(e){}});
  $("#addp").onclick=()=>{grab();list.push({name:"New product",category:"Prints",badge:"",image:"",description:"",gradient:"#8d99ae,#2b2d42",active:true});paint()};
  $("#savep").onclick=()=>{grab();LS.set("ag_products",list);toast("Saved. Check the Shop and Home pages.")};
  $("#resetp").onclick=()=>{LS.set("ag_products",null);location.reload()};
  $$("[data-del]").forEach(b=>b.onclick=()=>{grab();list.splice(+b.dataset.del,1);paint()})};
 root.innerHTML='<div class="chips" id="dt"><button data-d="p" class="on">Products</button><button data-d="s">Site settings &amp; logo</button></div><div id="view" style="margin-top:20px;overflow-x:auto"></div>';
 $("#dt").onclick=e=>{const d=e.target.dataset.d;if(!d)return;$$("#dt button").forEach(b=>b.classList.toggle("on",b===e.target));if(d==="p"){list=JSON.parse(JSON.stringify(CONFIG.allProducts));paint()}else settings()};paint()}
async function gate(){
 if(!API.ready){demoAdmin();return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){root.innerHTML='<form class="box" id="lf" style="max-width:420px"><label class="f" for="ae">Email</label><input id="ae" type="email" required><label class="f" for="ap">Password</label><input id="ap" type="password" required><button class="btn" style="margin-top:12px">Sign in</button><p id="le" role="alert"></p></form>';
  $("#lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$("#ae").value,password:$("#ap").value});error?$("#le").textContent="Sign-in failed. Check your email and password.":gate()};return}
 const{data:p}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
 if(!p||p.role!=="admin"){root.innerHTML='<div class="box">This account does not have admin access.</div>';return}
 root.innerHTML=`<div class="chips" id="tabs">${TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("")}<button id="out">Sign out</button></div><div id="view" style="margin-top:24px;overflow-x:auto"></div>`;
 $("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t)openTab(t);if(e.target.id==="out")sb.auth.signOut().then(gate)};openTab("dash")}
function openTab(t){$$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({dash,orders,pricing_rules:pricing,site_settings:settings}[t]||(()=>table(t)))()}
async function orders(){const v=$("#view"),f=v.dataset.filter||"";
 let q=sb.from("orders").select("*").order("created_at",{ascending:false}).limit(100);q=f?q.eq("status",f):q.neq("status","Pending Payment");
 const{data,error}=await q;if(error){v.textContent="Couldn't load orders.";return}
 v.innerHTML=`<label class="f" for="sf">Status</label><select id="sf" style="max-width:260px"><option value="">Active orders</option>${ST.map(s=>`<option ${s===f?"selected":""}>${s}</option>`).join("")}</select>`+
 (data.length?data.map(o=>`<div class="box" style="margin-top:12px" data-id="${o.id}"><b>${esc(o.order_number)}</b> · ${new Date(o.created_at).toLocaleString()} · ${esc(o.customer_email)} · $${(+o.total).toFixed(2)}<br><small>${esc(o.customer_name)} · ${esc(Object.values(o.shipping_address||{}).join(", "))} · ${esc(o.shipping_method)}</small>
 <ul>${o.items.map(i=>`<li>${esc(i.name)} ${i.d.join("×")} in, ${esc(i.finish)}, ${esc(i.mount)}${i.enh!=="None"?", enhanced":""}, qty ${+i.qty} ${i.file?`<button class="cartbtn" data-f="${esc(i.file)}">Artwork</button>`:""}${(i.files||[]).map((f,k)=>`<button class="cartbtn" data-f="${esc(f)}">Panel ${k+1}</button>`).join(" ")}</li>`).join("")}</ul>
 <div class="cols2"><select data-s>${ST.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><input data-tr placeholder="Tracking number" value="${esc(o.tracking_number||"")}"></div><label style="font-size:14px;display:block;margin-top:8px"><input type="checkbox" data-mail checked> Email customer when status is Production, Shipped or Delivered</label><button class="btn" data-save style="margin-top:8px">Save</button></div>`).join(""):"<p>No orders.</p>");
 $("#sf").onchange=e=>{v.dataset.filter=e.target.value;orders()}}
document.addEventListener("click",async e=>{const b=e.target,go=b.closest("[data-go]");if(go){$("#view").dataset.filter=go.dataset.go;openTab("orders");return}
 if(b.dataset.f){const{data}=await sb.storage.from("designs").createSignedUrl(b.dataset.f,300);data?window.open(data.signedUrl):toast("Couldn't open artwork.")}
 if(b.dataset.save!==undefined){const c=b.closest("[data-id]"),s=c.querySelector("[data-s]").value;
 const{error}=await sb.from("orders").update({status:s,tracking_number:c.querySelector("[data-tr]").value||null}).eq("id",c.dataset.id);
 if(error){toast("Save failed.");return}
 if(c.querySelector("[data-mail]").checked&&["Production","Shipped","Delivered"].includes(s)){
  const{data,error:e2}=await sb.functions.invoke("order-status-email",{body:{order_id:c.dataset.id}});
  toast(e2?"Saved, but the email failed to send.":data&&data.skipped?"Saved. This email was already sent.":"Saved and customer emailed")}else toast("Saved")}});
async function table(n){const[ord,cols]=T[n],v=$("#view"),{data,error}=await sb.from(n).select("*").order(ord);if(error){v.textContent="Couldn't load.";return}
 const cell=(c,r)=>{const[k,t]=c,x=r?r[k]:(t==="b"?true:"");if(t==="i")return `<td><img data-th ${x?`src="${esc(x)}"`:"hidden"} alt="" style="height:40px;display:block;margin-bottom:4px"><input type="file" data-up accept="image/jpeg,image/png,image/webp"><input type="hidden" data-c="image" data-t="t" value="${esc(x)}"><button type="button" class="cartbtn" data-rmimg style="margin-top:4px">Remove photo</button></td>`;return t==="b"?`<td><input type="checkbox" data-c="${k}" ${x?"checked":""}></td>`:`<td><input data-c="${k}" data-t="${t}" value="${esc(t==="p"&&r?Math.round(x*10000)/100:x)}"></td>`};
 v.innerHTML=`<table class="at"><tr>${cols.map(c=>`<th align="left">${c[2]||c[0]}</th>`).join("")}<th></th></tr>${data.map(r=>`<tr data-row data-pk="${esc(r.id)}">${cols.map(c=>cell(c,r)).join("")}<td><button class="cartbtn" data-sv>Save</button> <button class="cartbtn" data-del>Delete</button></td></tr>`).join("")}<tr data-row data-new>${cols.map(c=>cell(c,null)).join("")}<td><button class="cartbtn" data-sv>Add new</button></td></tr></table>`;
 v.onchange=async e=>{const i=e.target;if(i.dataset.up===undefined||!i.files[0])return;const tr=i.closest("[data-row]");
  try{const blob=await shrink(i.files[0],900,false),p="products/"+crypto.randomUUID()+".jpg",u=await sb.storage.from("site-assets").upload(p,blob,{contentType:"image/jpeg"});if(u.error)throw u.error;
   const url=sb.storage.from("site-assets").getPublicUrl(p).data.publicUrl;tr.querySelector("[data-c=image]").value=url;const th=tr.querySelector("[data-th]");th.src=url;th.hidden=false;toast("Photo uploaded. Click Save on this row.")}catch(err){toast("Photo upload failed.")}};
 v.onclick=async e=>{const go=e.target.closest("[data-go]");if(go)return;const tr=e.target.closest("[data-row]");if(!tr)return;
  if(e.target.dataset.rmimg!==undefined){tr.querySelector("[data-c=image]").value="";tr.querySelector("[data-th]").hidden=true;toast("Photo removed. Click Save on this row.");return}
  if(e.target.dataset.del!==undefined){if(!confirm("Delete this row?"))return;const{error}=await sb.from(n).delete().eq("id",tr.dataset.pk);toast(error?"Delete failed.":"Deleted");table(n)}
  if(e.target.dataset.sv!==undefined){const row={};tr.querySelectorAll("[data-c]").forEach(i=>{const k=i.dataset.c,t=i.dataset.t;row[k]=i.type==="checkbox"?i.checked:t==="n"?(i.value===""?null:+i.value):t==="p"?+i.value/100:i.value});
   if(tr.dataset.pk)row.id=tr.dataset.pk;const{error}=await sb.from(n).upsert(row);toast(error?"Save failed. Check the values.":"Saved");if(!error)table(n)}}}
gate();
</script></body></html>
